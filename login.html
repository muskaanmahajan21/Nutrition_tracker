<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Signup - Nutrition Tracker</title>

<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .form-container {
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        width: 450px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }
    .logo {
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        color: #4CAF50;
        margin-bottom: 20px;
    }
    .tab {
        display: flex;
        justify-content: space-around;
        margin-bottom: 20px;
        border-bottom: 1px solid #ddd;
    }
    .tab button {
        background: none;
        border: none;
        padding: 12px;
        cursor: pointer;
        font-weight: 600;
        color: #444;
        position: relative;
    }
    .active {
        color: #4CAF50;
    }
    .active::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 3px;
        background: #4CAF50;
    }
    form {
        display: flex;
        flex-direction: column;
    }
    .form-group { margin-bottom: 15px; }
    label {
        display: block;
        font-size: 14px;
        margin-bottom: 5px;
    }
    input, select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
    }
    button {
        padding: 14px;
        background: #4CAF50;
        border: none;
        color: #fff;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
    }
    .error-message, .success-message {
        padding: 10px;
        text-align: center;
        margin-bottom: 10px;
        display: none;
        border-radius: 5px;
        font-size: 14px;
    }
    .error-message {
        background: #ffebee;
        color: #d32f2f;
    }
    .success-message {
        background: #e8f5e9;
        color: #2e7d32;
    }
    .security-questions {
        padding: 10px;
        border: 1px solid #ddd;
        margin-top: 10px;
        border-radius: 6px;
    }
</style>

</head>
<body>

<div class="form-container">

    <div class="logo">Nutrition Tracker</div>

    <div class="tab">
        <button id="showLogin" class="active">Login</button>
        <button id="showSignup">Sign Up</button>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
        <input type="hidden" name="form_type" value="login">

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" name="email" placeholder="Enter email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit">Login</button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signupForm" style="display:none;">
        <input type="hidden" name="form_type" value="signup">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" placeholder="Phone">
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" placeholder="Age">
        </div>

        <div class="form-group">
            <label>Birthdate</label>
            <input type="date" name="birthdate" required>
        </div>

        <div class="security-questions">
            <label>Security Question 1</label>
            <select name="security_question1" required>
                <option value="">Select</option>
                <option>First pet name?</option>
                <option>Birth city?</option>
                <option>Mother's maiden name?</option>
            </select>
            <input type="text" name="security_answer1" placeholder="Answer" required>

            <label>Security Question 2</label>
            <select name="security_question2" required>
                <option value="">Select</option>
                <option>Elementary school name?</option>
                <option>Childhood nickname?</option>
                <option>Favourite book?</option>
            </select>
            <input type="text" name="security_answer2" placeholder="Answer" required>
        </div>

        <button type="submit">Create Account</button>
    </form>

</div>

<script>
/* -------- STORAGE FUNCTIONS -------- */
function saveUser(user) {
    let users = JSON.parse(localStorage.getItem("users")) || [];
    if (users.some(u => u.email === user.email)) {
        return { success: false, message: "Email already exists" };
    }
    users.push(user);
    localStorage.setItem("users", JSON.stringify(users));
    return { success: true };
}

function loginUser(email, password) {
    let users = JSON.parse(localStorage.getItem("users")) || [];
    const user = users.find(u => u.email === email && u.password === password);
    if (!user) return { success: false, message: "Invalid email or password" };
    localStorage.setItem("loggedInUser", JSON.stringify(user));
    return { success: true };
}

function showError(msg) {
    const el = document.getElementById("errorMessage");
    el.innerText = msg;
    el.style.display = "block";
    document.getElementById("successMessage").style.display = "none";
}

function showSuccess(msg) {
    const el = document.getElementById("successMessage");
    el.innerText = msg;
    el.style.display = "block";
    document.getElementById("errorMessage").style.display = "none";
}

/* -------- TAB SWITCH -------- */
document.getElementById("showLogin").onclick = () => {
    document.getElementById("loginForm").style.display = "block";
    document.getElementById("signupForm").style.display = "none";
    document.getElementById("showLogin").classList.add("active");
    document.getElementById("showSignup").classList.remove("active");
};

document.getElementById("showSignup").onclick = () => {
    document.getElementById("signupForm").style.display = "block";
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("showSignup").classList.add("active");
    document.getElementById("showLogin").classList.remove("active");
};

/* -------- LOGIN -------- */
document.getElementById("loginForm").onsubmit = (e) => {
    e.preventDefault();
    const email = loginForm.email.value;
    const password = loginForm.password.value;

    const result = loginUser(email, password);
    if (!result.success) return showError(result.message);

    showSuccess("Login successful! Redirecting...");
    setTimeout(() => location.href = "home.html", 1500);
};

/* -------- SIGNUP -------- */
document.getElementById("signupForm").onsubmit = (e) => {
    e.preventDefault();
    const form = signupForm;

    const newUser = {
        name: form.name.value,
        email: form.email.value,
        password: form.password.value,
        phone: form.phone.value,
        age: form.age.value,
        birthdate: form.birthdate.value,
        sq1: form.security_question1.value,
        a1: form.security_answer1.value,
        sq2: form.security_question2.value,
        a2: form.security_answer2.value
    };

    const result = saveUser(newUser);
    if (!result.success) return showError(result.message);

    showSuccess("Account created! Redirecting...");
    setTimeout(() => location.href = "login.html", 1500);
};
</script>

</body>
</html>
